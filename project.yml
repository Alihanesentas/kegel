name: PelvicApp

options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  bundleIdPrefix: com.kegel
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Core:
    path: Packages/Core
  Persistence:
    path: Packages/Persistence
  Feedback:
    path: Packages/Feedback
  Notifications:
    path: Packages/Notifications
  Purchases:
    path: Packages/Purchases
  RemoteContent:
    path: Packages/RemoteContent
  Analytics:
    path: Packages/Analytics
  LiveSession:
    path: Packages/LiveSession
  Sync:
    path: Packages/Sync
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features

targets:
  PelvicApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kegel.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - package: Core
      - package: Persistence
      - package: Feedback
      - package: Notifications
      - package: Purchases
      - package: RemoteContent
      - package: Analytics
      - package: LiveSession
      - package: Sync
      - package: DesignSystem
      - package: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Routine
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # No UIBackgroundModes on purpose. CLAUDE.md section 7: background
        # audio may only be declared once the app genuinely plays audio in the
        # background, and keeping a silent loop alive to stay resident risks
        # App Store rejection. Eyes-free use is dim mode today, and the Watch
        # app later.

schemes:
  PelvicApp:
    build:
      targets:
        PelvicApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PelvicApp
