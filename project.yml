name: PelvicApp

options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  bundleIdPrefix: com.kegel
  generateEmptyDirectories: true

# "Subscription Build" is a third Xcode configuration, alongside the default
# Debug/Release, that ships with everything unlocked — no paywall, no locked
# levels. It's for App Store review and demos only, never for a real release.
# It's release-optimized (`type: release`) so it behaves like what reviewers
# actually get, just with the entitlement gate compiled out.
#
# `SWIFT_ACTIVE_COMPILATION_CONDITIONS` set here is a project-wide setting,
# so it reaches the local Swift packages (Features, in particular) the same
# way Debug/Release do — not just the app target.
configs:
  Debug: debug
  Release: release
  Subscription Build: release

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    Subscription Build:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SUBSCRIPTION_BUILD"

packages:
  Core:
    path: Packages/Core
  Persistence:
    path: Packages/Persistence
  Feedback:
    path: Packages/Feedback
  Notifications:
    path: Packages/Notifications
  Purchases:
    path: Packages/Purchases
  RemoteContent:
    path: Packages/RemoteContent
  Analytics:
    path: Packages/Analytics
  LiveSession:
    path: Packages/LiveSession
  Sync:
    path: Packages/Sync
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features

targets:
  PelvicApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: App/Assets.xcassets
    # The String Catalog for every screen lives here rather than in the
    # Features package — see Packages/Features/Package.swift for why.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kegel.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # RevenueCat public SDK key. Empty here on purpose — keys are not
        # committed. Provide it locally via Config/Secrets.xcconfig (gitignored)
        # or as a CI secret. While it's empty the app runs with purchasing off
        # rather than showing a paywall that can't complete a sale.
        REVENUECAT_API_KEY: ""
    dependencies:
      - package: Core
      - package: Persistence
      - package: Feedback
      - package: Notifications
      - package: Purchases
      - package: RemoteContent
      - package: Analytics
      - package: LiveSession
      - package: Sync
      - package: DesignSystem
      - package: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Routine
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # No UIBackgroundModes on purpose. CLAUDE.md section 7: background
        # audio may only be declared once the app genuinely plays audio in the
        # background, and keeping a silent loop alive to stay resident risks
        # App Store rejection. Eyes-free use is dim mode today, and the Watch
        # app later.

schemes:
  # No test action: `PelvicApp` is a thin composition-root shell (CLAUDE.md
  # section 3) with no test bundle of its own. Every unit test lives in a
  # Swift package under Packages/*/Tests and is run directly against that
  # package (see .github/workflows/ci.yml's `packages` and `ios-packages`
  # jobs), not through this scheme.
  PelvicApp:
    build:
      targets:
        PelvicApp: all
    run:
      config: Debug
  # Everything unlocked, no paywall — for App Store review and demos.
  # See the `Subscription Build` config above and
  # Packages/Features/Sources/Features/Shared/SubscriptionBuildConfiguration.swift.
  PelvicApp Subscription:
    build:
      targets:
        PelvicApp: all
    run:
      config: Subscription Build
    archive:
      config: Subscription Build
