excluded:
  - .build
  - Packages/Core/.build
  - Packages/DesignSystem/.build
  - Packages/Features/.build
  - Packages/Persistence/.build

disabled_rules:
  - todo

# `force_unwrapping` is deliberately not opted into. CI runs SwiftLint with
# --strict, and the rule fires on test fixtures that force-unwrap known-good
# literals (inline JSON, fixture URLs) — turning it on would fail the build
# over noise rather than over risk.

# Design system spacing tokens use abbreviated names (xs, sm, md, lg, xl) — a
# well-established convention in design systems. Exclude these from identifier_name.
# Also exclude common model properties like 'id'.
identifier_name:
  excluded:
    - xs
    - sm
    - md
    - lg
    - xl
    - id

line_length:
  warning: 120
  error: 160
  ignores_comments: true
